name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Environment & Dependencies
        run: |
          echo "A configurar o ambiente de compilação..."
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential curl p7zip-full

      - name: Download and Merge ROM Assets from GitHub Release
        run: |
          echo "A descarregar as partes dos assets da Release do GitHub..."
          mkdir -p rom_download romfs_extracted
          
          curl -L -o rom_download/smm2_assets.zip.001 "https://github.com/${{ github.repository }}/releases/download/v1.0/smm2_assets.zip.001"
          curl -L -o rom_download/smm2_assets.zip.002 "https://github.com/${{ github.repository }}/releases/download/v1.0/smm2_assets.zip.002"
          
          echo "A juntar e a extrair o arquivo dividido..."
          cd rom_download
          7z x smm2_assets.zip.001 -o../romfs_extracted/
          cd ..
          
          if [ -d "romfs_extracted/smm2_assets/exefs" ]; then
            mv romfs_extracted/smm2_assets/* romfs_extracted/
          fi
          
          mkdir -p build/romfs build/exefs
          if [ -d "romfs_extracted/romfs" ]; then
            cp -r romfs_extracted/romfs/* build/romfs/
          fi
          if [ -d "romfs_extracted/romfs" ]; then
            cp -r romfs_extracted/romfs/* build/romfs/
          fi
          if [ -d "romfs_extracted/exefs" ]; then
            cp -r romfs_extracted/exefs/* build/exefs/
          fi

      - name: Compile Android APK
        run: |
          echo "A procurar o CMakeLists.txt de forma alargada..."
          # Procura qualquer CMakeLists.txt excluindo pastas do sistema/git
          FOUND_PATH=$(find . -name "CMakeLists.txt" -not -path "*/.*" -not -path "./build/*" | head -n 1)
          
          if [ -z "$FOUND_PATH" ]; then
            echo "ERRO: O CMakeLists.txt não foi encontrado!"
            exit 1
          fi
          
          CMAKE_DIR=$(dirname "$FOUND_PATH")
          echo "Encontrado em: $CMAKE_DIR"
          
          echo "A iniciar a configuração e compilação..."
          cmake -B build_android -S "$CMAKE_DIR" -DCMAKE_BUILD_TYPE=Release
          cmake --build build_android -j$(nproc)
          
          echo "A procurar por ficheiros APK gerados..."
          find . -name "*.apk" -exec cp {} ./ \;
          ls -la

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smm2-android-apk
          path: |
            *.apk
            **/*.apk
