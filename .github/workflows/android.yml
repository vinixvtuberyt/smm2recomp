name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Environment & Dependencies
        run: |
          echo "A configurar o ambiente de compilação..."
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-dev build-essential curl p7zip-full

      - name: Download and Merge ROM Assets from GitHub Release
        run: |
          echo "A descarregar as partes dos assets da Release do GitHub..."
          mkdir -p rom_download romfs_extracted
          
          curl -L -o rom_download/smm2_assets.zip.001 "https://github.com/${{ github.repository }}/releases/download/v1.0/smm2_assets.zip.001"
          curl -L -o rom_download/smm2_assets.zip.002 "https://github.com/${{ github.repository }}/releases/download/v1.0/smm2_assets.zip.002"
          
          echo "A juntar e a extrair o arquivo dividido..."
          cd rom_download
          7z x smm2_assets.zip.001 -o../romfs_extracted/
          cd ..
          
          if [ -d "romfs_extracted/smm2_assets/exefs" ]; then
            mv romfs_extracted/smm2_assets/* romfs_extracted/
          fi
          
          mkdir -p assets romfs exefs
          if [ -d "romfs_extracted/romfs" ]; then
            cp -r romfs_extracted/romfs/* romfs/
          fi
          if [ -d "romfs_extracted/exefs" ]; then
            cp -r romfs_extracted/exefs/* exefs/
          fi

      - name: Compile Android APK via Recomp Script
        run: |
          echo "A executar o script de compilação..."
          if [ -f "scripts/build_android.py" ]; then
            python3 scripts/build_android.py
          elif [ -f "build.py" ]; then
            python3 build.py
          else
            python3 -m pip install --upgrade pip
            # Procura e executa qualquer script python de build na raiz ou scripts
            python3 -c "import glob; print(glob.glob('**/*.py', recursive=True))"
          fi
          
          echo "A procurar por todos os ficheiros APK gerados no sistema..."
          find . -name "*.apk" -print

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smm2-android-apk
          path: |
            *.apk
            **/*.apk
            **/build/**/*.apk
            **/bin/**/*.apk
            dist/*.apk
