name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Environment & Dependencies
        run: |
          echo "A configurar o ambiente de compilação..."
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-dev build-essential curl p7zip-full android-sdk-common

      - name: Download and Merge ROM Assets from GitHub Release
        run: |
          echo "A descarregar as partes dos assets da Release do GitHub..."
          mkdir -p rom_download romfs_extracted
          
          curl -L -o rom_download/smm2_assets.zip.001 "https://github.com/${{ github.repository }}/releases/download/v1.0/smm2_assets.zip.001"
          curl -L -o rom_download/smm2_assets.zip.002 "https://github.com/${{ github.repository }}/releases/download/v1.0/smm2_assets.zip.002"
          
          echo "A juntar e a extrair o arquivo dividido..."
          cd rom_download
          7z x smm2_assets.zip.001 -o../romfs_extracted/
          cd ..
          
          if [ -d "romfs_extracted/smm2_assets/exefs" ]; then
            mv romfs_extracted/smm2_assets/* romfs_extracted/
          fi
          
          mkdir -p assets romfs exefs
          if [ -d "romfs_extracted/romfs" ]; then
            cp -r romfs_extracted/romfs/* romfs/
          fi
          if [ -d "romfs_extracted/exefs" ]; then
            cp -r romfs_extracted/exefs/* exefs/
          fi

      - name: Compile Android APK via Python Build Script
        run: |
          echo "A listar a pasta de scripts e raiz para identificar o comando de build..."
          ls -la scripts/
          
          echo "A executar o script de empacotamento/build para Android..."
          # A maioria dos repos recomp usa um script específico para gerar o APK
          if [ -f "scripts/build.py" ]; then
            python3 scripts/build.py --platform android
          elif [ -f "build.py" ]; then
            python3 build.py --platform android
          else
            # Tenta correr todos os scripts python disponíveis que tenham 'build' no nome
            python3 scripts/*.py || true
          fi
          
          echo "A procurar exaustivamente por qualquer ficheiro APK ou ELF gerado..."
          find . -name "*.apk" -o -name "*.elf" -o -name "*.so"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smm2-android-apk
          path: |
            *.apk
            **/*.apk
            **/build/**/*.apk
            **/bin/**/*.apk
            dist/*.apk
            output/*.apk
