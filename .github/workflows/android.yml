name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:trixie

    steps:
      - name: Install System Dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git make zip unzip zstd xz-utils python3 python3-pip \
          libsdl3-dev libvulkan-dev libshaderc-dev libvulkan-memory-allocator-dev gcc libc6-dev p7zip-full cmake ninja-build

      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download and Merge ROM Assets from GitHub Release into recomp/
        run: |
          echo "A descarregar os assets da Release..."
          mkdir -p recomp/rom_download recomp/romfs_extracted
          
          curl -L -o recomp/rom_download/smm2_assets.zip.001 "https://github.com/${{ github.repository }}/releases/download/v1.0/smm2_assets.zip.001"
          curl -L -o recomp/rom_download/smm2_assets.zip.002 "https://github.com/${{ github.repository }}/releases/download/v1.0/smm2_assets.zip.002"
          
          cd recomp/rom_download
          7z x smm2_assets.zip.001 -o../romfs_extracted/
          cd ../..
          
          # Organizar os assets na estrutura que o recomp espera
          mkdir -p recomp/romfs recomp/exefs
          if [ -d "recomp/romfs_extracted/romfs" ]; then
            cp -r recomp/romfs_extracted/romfs/* recomp/romfs/
          fi
          if [ -d "recomp/romfs_extracted/exefs" ]; then
            cp -r recomp/romfs_extracted/exefs/* recomp/exefs/
          fi
          if [ -d "recomp/romfs_extracted/smm2_assets/romfs" ]; then
            cp -r recomp/romfs_extracted/smm2_assets/romfs/* recomp/romfs/
          fi
          if [ -d "recomp/romfs_extracted/smm2_assets/exefs" ]; then
            cp -r recomp/romfs_extracted/smm2_assets/exefs/* recomp/exefs/
          fi

      - name: Compile Android Target inside recomp/
        working-directory: recomp
        run: |
          echo "A preparar o ambiente python e dependências..."
          make venv || true
          
          echo "A iniciar a compilação para Android..."
          # O Makefile dentro de recomp gere o build completo
          make GAME=smm2 TARGET=android || make GAME=smm2
          
          echo "A procurar ficheiros APK ou binários gerados..."
          find . -name "*.apk" -o -name "*.so" -o -name "*.elf"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smm2-android-apk
          path: |
            recomp/**/*.apk
            recomp/dist/*.apk
            *.apk
            **/*.apk
