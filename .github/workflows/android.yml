name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Environment & Dependencies
        run: |
          echo "A configurar o ambiente..."
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-dev build-essential curl p7zip-full

      - name: Download and Merge ROM Assets from GitHub Release
        run: |
          echo "A descarregar os assets da Release..."
          mkdir -p rom_download romfs_extracted
          
          curl -L -o rom_download/smm2_assets.zip.001 "https://github.com/${{ github.repository }}/releases/download/v1.0/smm2_assets.zip.001"
          curl -L -o rom_download/smm2_assets.zip.002 "https://github.com/${{ github.repository }}/releases/download/v1.0/smm2_assets.zip.002"
          
          cd rom_download
          7z x smm2_assets.zip.001 -o../romfs_extracted/
          cd ..
          
          if [ -d "romfs_extracted/smm2_assets/exefs" ]; then
            mv romfs_extracted/smm2_assets/* romfs_extracted/
          fi
          
          mkdir -p assets romfs exefs
          if [ -d "romfs_extracted/romfs" ]; then
            cp -r romfs_extracted/romfs/* romfs/
          fi
          if [ -d "romfs_extracted/exefs" ]; then
            cp -r romfs_extracted/exefs/* exefs/
          fi

      - name: Compile Android APK via Dynamic Python Discovery
        run: |
          echo "A listar os ficheiros Python disponíveis no repositório..."
          find . -name "*.py" -not -path "*/.*"
          
          echo "A executar o script de build detetado..."
          # Procura por qualquer script python de build ou compilação e executa-o
          BUILD_SCRIPT=$(find . -name "build*.py" -not -path "*/.*" | head -n 1)
          
          if [ -n "$BUILD_SCRIPT" ]; then
            echo "A executar: python3 $BUILD_SCRIPT"
            python3 "$BUILD_SCRIPT"
          else
            echo "Aviso: Nenhum script build*.py encontrado, a listar raiz..."
            ls -la
          fi
          
          echo "A procurar por qualquer APK ou binário gerado..."
          find . -name "*.apk" -o -name "*.bin" -o -name "*.elf"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smm2-android-apk
          path: |
            *.apk
            **/*.apk
            **/build/**/*.apk
            **/dist/**/*.apk
            build/
            out/
