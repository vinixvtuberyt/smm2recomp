name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Environment & Dependencies
        run: |
          echo "A configurar o ambiente de compilação..."
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential

      - name: Download and Extract ROM Assets from Google Drive
        env:
          ROM_ASSETS_URL: ${{ secrets.ROM_ASSETS_URL }}
        run: |
          echo "A descarregar os assets do Google Drive..."
          mkdir -p rom_download romfs_extracted
          
          # Descarregar seguindo redirecionamentos do Google Drive
          curl -c ./cookie -s -L "$ROM_ASSETS_URL" > rom_download/smm2.zip
          
          # Verificar se o ficheiro descarregado é um HTML de aviso
          if head -n 1 rom_download/smm2.zip | grep -q "<html"; then
            echo "ERRO: O link do Google Drive devolveu uma página HTML em vez do ficheiro .zip!"
            echo "Certifica-te de que o link do Google Drive está configurado para acesso público e usa o formato de download direto (uc?export=download&id=...)."
            exit 1
          fi
          
          echo "A extrair o ficheiro .zip..."
          unzip -q rom_download/smm2.zip -d romfs_extracted/
          
          if [ -d "romfs_extracted/smm2_assets/exefs" ]; then
            mv romfs_extracted/smm2_assets/* romfs_extracted/
          fi
          
          mkdir -p build/romfs build/exefs
          if [ -d "romfs_extracted/romfs" ]; then
            cp -r romfs_extracted/romfs/* build/romfs/
          fi
          if [ -d "romfs_extracted/exefs" ]; then
            cp -r romfs_extracted/exefs/* build/exefs/
          fi

      - name: Compile Android APK
        run: |
          echo "A procurar o CMakeLists.txt em todo o workspace..."
          FOUND_PATH=$(find . -name "CMakeLists.txt" -not -path "*/.*" | head -n 1)
          
          if [ -z "$FOUND_PATH" ]; then
            echo "ERRO: O CMakeLists.txt não foi encontrado em nenhuma pasta!"
            exit 1
          fi
          
          CMAKE_DIR=$(dirname "$FOUND_PATH")
          echo "Encontrado com sucesso em: $CMAKE_DIR"
          
          echo "A iniciar a compilação..."
          cmake -B build -S "$CMAKE_DIR" -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)
          
          echo "A procurar por ficheiros APK gerados..."
          find . -name "*.apk" -exec cp {} ./ \;
          ls -la

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smm2-android-apk
          path: |
            *.apk
            build/**/*.apk
