name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Read Build Instructions & Scripts
        run: |
          echo "=== CONTEÚDO DO README.md ==="
          cat README.md
          
          echo "=== FICHEIROS EM SCRIPTS, RECOMP E CORE ==="
          ls -la scripts/ recomp/ core/ tools/
          
          echo "=== OUTROS WORKFLOWS DO REPOSITÓRIO ==="
          ls -la .github/workflows/
          cat .github/workflows/release.yml || true
